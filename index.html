<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>আমানাহ অনলাইন শপ</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Noto Sans Bengali",sans-serif;background:#f6f7f9;color:#18212f}header{background:#fff;border-bottom:1px solid #e5e7eb;position:sticky;top:0;z-index:5}.wrap{max-width:1150px;margin:auto;padding:0 18px}.nav{min-height:72px;display:flex;align-items:center;gap:14px}.brand{font-weight:900;font-size:21px;color:#146c43}.logo{width:44px;height:44px;border-radius:12px;object-fit:cover;background:#e9f5ee}.search{flex:1;padding:12px;border:1px solid #dfe4ea;border-radius:12px}.hero{margin:25px 0;padding:42px 30px;border-radius:22px;background:linear-gradient(120deg,#0f5132,#198754);color:#fff}.hero h1{font-size:38px;margin:0 0 8px}.cats{display:flex;gap:9px;overflow:auto}.cat{white-space:nowrap;border:1px solid #ddd;background:#fff;padding:10px 15px;border-radius:99px}.active{background:#146c43;color:#fff}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{background:#fff;border:1px solid #e6e9ee;border-radius:16px;overflow:hidden}.pic{height:190px;background:#eef1f4;display:flex;align-items:center;justify-content:center}.pic img{width:100%;height:100%;object-fit:cover}.info{padding:14px}.price{font-size:19px;font-weight:900;color:#146c43}.add{width:100%;padding:10px;border:0;border-radius:10px;background:#146c43;color:#fff;font-weight:800}.cart{margin-left:auto;padding:11px 14px;border:0;border-radius:10px;background:#146c43;color:#fff}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:18px}.box{background:#fff;border-radius:18px;padding:20px;max-width:520px;width:100%}.box input,.box textarea{width:100%;padding:11px;margin:6px 0 10px;border:1px solid #ddd;border-radius:9px}.empty{text-align:center;padding:50px;color:#778}
@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.nav{flex-wrap:wrap;padding:10px 0}.search{order:4;flex-basis:100%}.grid{grid-template-columns:1fr 1fr}.hero h1{font-size:29px}}
</style></head>
<body><header><div class="wrap nav"><img id="logo" class="logo" src="assets/logo-placeholder.svg"><div class="brand">আমানাহ অনলাইন শপ</div><button class="cart" onclick="openCart()">🛒 <span id="cc">0</span></button><input id="search" class="search" placeholder="পণ্য খুঁজুন..."></div></header>
<main class="wrap"><section class="hero"><h1>আমানাহ অনলাইন শপে স্বাগতম</h1><p>বিশ্বস্ত পণ্য, সহজ অর্ডার এবং দ্রুত ডেলিভারি।</p></section><h2>ক্যাটাগরি</h2><div id="cats" class="cats"></div><h2>পণ্যসমূহ</h2><div id="grid" class="grid"></div></main>
<div id="modal" class="modal"><div class="box"><h2>অর্ডার করুন</h2><div id="cartlines"></div><input id="customer" placeholder="আপনার নাম"><input id="phone" placeholder="মোবাইল নম্বর"><textarea id="address" placeholder="সম্পূর্ণ ঠিকানা"></textarea><button class="cart" onclick="placeOrder()">অর্ডার কনফার্ম করুন</button> <button onclick="modal.style.display='none'">বন্ধ</button></div></div>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
import {SUPABASE_URL,SUPABASE_ANON_KEY} from './config.js';
const sb=createClient(SUPABASE_URL,SUPABASE_ANON_KEY);let products=[],cart=[],active='সব';
async function load(){let {data}=await sb.from('products').select('*,categories(name)').eq('is_active',true).order('created_at',{ascending:false});products=data||[];render()}
function render(){let cs=['সব',...new Set(products.map(p=>p.categories?.name).filter(Boolean))];cats.innerHTML=cs.map(c=>`<button class="cat ${c==active?'active':''}" onclick="active='${c}';render()">${c}</button>`).join('');let q=search.value.toLowerCase();let list=products.filter(p=>(active==='সব'||p.categories?.name===active)&&p.name.toLowerCase().includes(q));grid.innerHTML=list.length?list.map(p=>`<article class="card"><div class="pic">${p.image_url?`<img src="${p.image_url}">`:'ছবি নেই'}</div><div class="info"><b>${p.name}</b><p>${p.description||''}</p><div class="price">৳${Number(p.price).toLocaleString('bn-BD')}</div><button class="add" onclick="add('${p.id}')">কার্টে যোগ করুন</button></div></article>`).join(''):'<div class="empty">কোনো পণ্য পাওয়া যায়নি</div>'}
window.add=id=>{cart.push(products.find(p=>p.id===id));cc.textContent=cart.length;alert('কার্টে যোগ হয়েছে')};window.openCart=()=>{if(!cart.length)return alert('কার্ট খালি');cartlines.innerHTML=cart.map(p=>`<p>${p.name} — ৳${p.price}</p>`).join('');modal.style.display='flex'};
window.placeOrder=async()=>{if(!customer.value||!phone.value||!address.value)return alert('নাম, মোবাইল ও ঠিকানা দিন');let total=cart.reduce((s,p)=>s+Number(p.price),0);let {data:o,error}=await sb.from('orders').insert({customer_name:customer.value,phone:phone.value,address:address.value,total}).select().single();if(error)return alert(error.message);let {error:e}=await sb.from('order_items').insert(cart.map(p=>({order_id:o.id,product_id:p.id,product_name:p.name,quantity:1,unit_price:p.price})));if(e)return alert(e.message);alert('অর্ডার সফল হয়েছে।');cart=[];cc.textContent=0;modal.style.display='none'};
search.oninput=render;load();
</script></body></html>
